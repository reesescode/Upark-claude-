openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: parking
    description: Campus parking operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /garages:
    get:
      operationId: listGarages
      tags: [parking]
      summary: List campus garages
      description: Returns parking garages and lots for the active campus.
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [nearest, most_available, least_full]
            default: nearest
      responses:
        "200":
          description: Parking garages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Garage"
  /garages/{garageId}:
    get:
      operationId: getGarage
      tags: [parking]
      summary: Get garage details
      parameters:
        - name: garageId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Garage details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Garage"
        "404":
          description: Garage not found
  /garages/{garageId}/availability:
    patch:
      operationId: updateGarageAvailability
      tags: [parking]
      summary: Update a garage availability snapshot
      description: Backend-ready endpoint for future university parking data feeds.
      parameters:
        - name: garageId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AvailabilityUpdate"
      responses:
        "200":
          description: Updated garage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Garage"
        "404":
          description: Garage not found
  /garages/{garageId}/reports:
    get:
      operationId: listParkingReports
      tags: [parking]
      summary: List recent parking reports
      description: Returns database-backed student reports for a garage, newest first.
      parameters:
        - name: garageId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Recent parking reports
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ParkingReport"
        "404":
          description: Garage not found
    post:
      operationId: createParkingReport
      tags: [parking]
      summary: Submit a parking report
      description: Saves a student parking report for a garage. A student may report the same garage once every five minutes.
      parameters:
        - name: garageId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ParkingReportInput"
      responses:
        "201":
          description: Parking report created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParkingReport"
        "400":
          description: Invalid report
        "404":
          description: Garage not found
        "429":
          description: The student has reported this garage too recently
          headers:
            Retry-After:
              description: Seconds until another report may be submitted
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParkingReportRateLimitError"
  /campus/summary:
    get:
      operationId: getCampusSummary
      tags: [parking]
      summary: Get campus parking summary
      responses:
        "200":
          description: Campus parking summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CampusSummary"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Garage:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        shortName:
          type: string
        address:
          type: string
        type:
          type: string
          enum: [garage, lot]
        availableSpots:
          type: integer
        totalSpots:
          type: integer
        occupancyPercent:
          type: integer
        distanceMiles:
          type: number
        driveTimeMinutes:
          type: integer
        walkingTimeMinutes:
          type: integer
        status:
          type: string
          enum: [open, filling_up, nearly_full]
        openHours:
          type: string
        price:
          type: string
        permits:
          type: array
          items:
            type: string
        latitude:
          type: number
        longitude:
          type: number
        updatedAt:
          type: string
      required:
        - id
        - name
        - shortName
        - address
        - type
        - availableSpots
        - totalSpots
        - occupancyPercent
        - distanceMiles
        - driveTimeMinutes
        - walkingTimeMinutes
        - status
        - openHours
        - price
        - permits
        - latitude
        - longitude
        - updatedAt
    AvailabilityUpdate:
      type: object
      properties:
        availableSpots:
          type: integer
          minimum: 0
        totalSpots:
          type: integer
          minimum: 1
      required:
        - availableSpots
        - totalSpots
    ParkingReport:
      type: object
      properties:
        id:
          type: integer
        garageId:
          type: string
        availabilityStatus:
          type: string
          enum: [plenty_spots, filling_up, almost_full, full]
        createdAt:
          type: string
      required:
        - id
        - garageId
        - availabilityStatus
        - createdAt
    ParkingReportInput:
      type: object
      properties:
        userId:
          type: string
          minLength: 1
        availabilityStatus:
          type: string
          enum: [plenty_spots, filling_up, almost_full, full]
      required:
        - userId
        - availabilityStatus
    ParkingReportRateLimitError:
      type: object
      properties:
        error:
          type: string
        retryAfterSeconds:
          type: integer
          minimum: 1
        nextAllowedAt:
          type: string
          format: date-time
      required:
        - error
        - retryAfterSeconds
        - nextAllowedAt
    CampusSummary:
      type: object
      properties:
        openSpots:
          type: integer
        totalSpots:
          type: integer
        garagesCount:
          type: integer
        lastUpdatedAt:
          type: string
      required:
        - openSpots
        - totalSpots
        - garagesCount
        - lastUpdatedAt

