openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: parking
    description: Campus parking operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /garages:
    get:
      operationId: listGarages
      tags: [parking]
      summary: List campus garages
      description: Returns parking garages and lots for the active campus.
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [nearest, most_available, least_full]
            default: nearest
      responses:
        "200":
          description: Parking garages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Garage"
  /garages/{garageId}:
    get:
      operationId: getGarage
      tags: [parking]
      summary: Get garage details
      parameters:
        - name: garageId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Garage details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Garage"
        "404":
          description: Garage not found
  /garages/{garageId}/reports:
    get:
      operationId: listParkingReports
      tags: [parking]
      summary: List recent parking reports
      description: Returns database-backed student reports for a garage, newest first.
      parameters:
        - name: garageId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Recent parking reports
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ParkingReport"
        "404":
          description: Garage not found
    post:
      operationId: createParkingReport
      tags: [parking]
      summary: Submit a parking report
      description: Saves a student parking report for a garage. A student may report the same garage once every five minutes.
      parameters:
        - name: garageId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ParkingReportInput"
      responses:
        "201":
          description: Parking report created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParkingReport"
        "400":
          description: Invalid report
        "401":
          description: Sign in required
        "403":
          description: Verified profile required
        "409":
          description: Duplicate active report
        "404":
          description: Garage not found
        "429":
          description: The student has reported this garage too recently
          headers:
            Retry-After:
              description: Seconds until another report may be submitted
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParkingReportRateLimitError"
  /garages/{garageId}/reports/{reportId}/flag:
    post:
      operationId: flagParkingReportNote
      tags: [parking]
      parameters:
        - name: garageId
          in: path
          required: true
          schema:
            type: string
        - name: reportId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Note flagged for review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NoteFlagResult"
        "401":
          description: Sign in required
        "403":
          description: Profile required or cannot flag own note
        "404":
          description: Active note not found
        "429":
          description: Daily flag limit reached
  /rewards/me:
    get:
      operationId: getMyRewards
      tags: [parking]
      responses:
        "200":
          description: Signed-in contributor rewards
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RewardsSummary"
        "401":
          description: Sign in required
  /rewards/leaderboard:
    get:
      operationId: getRewardsLeaderboard
      tags: [parking]
      responses:
        "200":
          description: Top contributors with privacy-safe names
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LeaderboardEntry"
  /campus/summary:
    get:
      operationId: getCampusSummary
      tags: [parking]
      summary: Get campus parking summary
      responses:
        "200":
          description: Campus parking summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CampusSummary"
  /users/{userId}/profile:
    get:
      operationId: getUserProfile
      tags: [profile]
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: User profile data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfileData"
    put:
      operationId: upsertUserProfile
      tags: [profile]
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserProfileInput"
      responses:
        "200":
          description: Saved user profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfileData"
    delete:
      operationId: deleteUserAccount
      tags: [profile]
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "204":
          description: Account data deleted
  /users/{userId}/preferences:
    put:
      operationId: updateUserPreferences
      tags: [profile]
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserPreferencesInput"
      responses:
        "200":
          description: Saved preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPreferences"
  /users/{userId}/notifications:
    put:
      operationId: updateNotificationSettings
      tags: [profile]
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationSettingsInput"
      responses:
        "200":
          description: Saved notification settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationSettings"
  /users/{userId}/favorites:
    put:
      operationId: updateUserFavorites
      tags: [profile]
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserFavoritesInput"
      responses:
        "200":
          description: Saved favorite garage IDs
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
  /users/{userId}/parking-history:
    delete:
      operationId: clearUserParkingHistory
      tags: [profile]
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "204":
          description: Parking history cleared
  /users/{userId}/support-requests:
    post:
      operationId: createSupportRequest
      tags: [profile]
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupportRequestInput"
      responses:
        "201":
          description: Support request created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportRequest"
components:
  parameters:
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Garage:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        shortName:
          type: string
        address:
          type: string
        type:
          type: string
          enum: [garage, lot]
        availableSpots:
          type: ["integer", "null"]
        totalSpots:
          type: integer
        occupancyPercent:
          type: ["integer", "null"]
        distanceMiles:
          type: number
        status:
          type: string
          enum: [open, filling_up, nearly_full, unknown]
        openHours:
          type: string
        price:
          type: string
        permits:
          type: array
          items:
            type: string
        latitude:
          type: number
        longitude:
          type: number
        updatedAt:
          type: string
        availabilitySource:
          type: string
          enum: [verified_reports, live_update, demo, user_reports_only]
          description: live_update values are ingested server-side from the official FGCU Parking Services source; public clients cannot submit them.
        availabilityConfidence:
          type: string
          enum: [high, medium, low, unavailable]
        availabilityIsStale:
          type: boolean
        availabilityReportCount:
          type: integer
        availabilityUpdatedAt:
          type: ["string", "null"]
        latestReportStatus:
          type: ["string", "null"]
          enum: [plenty_spots, filling_up, almost_full, full, null]
          description: Latest active verified student report; never a live space count.
      required:
        - id
        - name
        - shortName
        - address
        - type
        - availableSpots
        - totalSpots
        - occupancyPercent
        - distanceMiles
        - status
        - openHours
        - price
        - permits
        - latitude
        - longitude
        - updatedAt
        - availabilitySource
        - availabilityConfidence
        - availabilityIsStale
        - availabilityReportCount
        - availabilityUpdatedAt
    ParkingReport:
      type: object
      properties:
        note:
          type: ["string", "null"]
          maxLength: 100
        noteEmergency:
          type: boolean
        id:
          type: integer
        garageId:
          type: string
        availabilityStatus:
          type: string
          enum: [plenty_spots, filling_up, almost_full, full]
        createdAt:
          type: string
        isVerified:
          type: boolean
        expiresAt:
          type: string
        pointsEarned:
          type: integer
      required:
        - id
        - garageId
        - availabilityStatus
        - createdAt
        - isVerified
    ParkingReportInput:
      type: object
      properties:
        note:
          type: string
          maxLength: 100
        location:
          $ref: "#/components/schemas/ReportLocation"
        availabilityStatus:
          type: string
          enum: [plenty_spots, filling_up, almost_full, full]
      required:
        - location
        - availabilityStatus
    NoteFlagResult:
      type: object
      required: [message]
      properties:
        message:
          type: string
    ReportLocation:
      type: object
      properties:
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
        accuracy:
          type: number
          minimum: 0
          maximum: 100
        timestamp:
          type: number
      required: [latitude, longitude, accuracy, timestamp]
    RewardsSummary:
      type: object
      properties:
        totalPoints:
          type: integer
        validReports:
          type: integer
        currentStreak:
          type: integer
        reportsRemainingToday:
          type: integer
        level:
          type: string
        resetsAt:
          type: string
        timeZone:
          type: string
      required: [totalPoints, validReports, currentStreak, reportsRemainingToday, level, resetsAt, timeZone]
    LeaderboardEntry:
      type: object
      properties:
        rank:
          type: integer
        name:
          type: string
        totalPoints:
          type: integer
        validReports:
          type: integer
        level:
          type: string
      required: [rank, name, totalPoints, validReports, level]
    ParkingReportRateLimitError:
      type: object
      properties:
        error:
          type: string
        retryAfterSeconds:
          type: integer
          minimum: 1
        nextAllowedAt:
          type: string
          format: date-time
      required:
        - error
        - retryAfterSeconds
        - nextAllowedAt
    CampusSummary:
      type: object
      properties:
        openSpots:
          type: integer
        totalSpots:
          type: integer
        garagesCount:
          type: integer
        lastUpdatedAt:
          type: ["string", "null"]
          description: Latest trusted observation time, or null when every location is using demo data.
        liveGaragesCount:
          type: integer
        staleGaragesCount:
          type: integer
        demoGaragesCount:
          type: integer
      required:
        - openSpots
        - totalSpots
        - garagesCount
        - lastUpdatedAt
        - liveGaragesCount
        - staleGaragesCount
        - demoGaragesCount
    UserProfileInput:
      type: object
      properties:
        firstName:
          type: string
          minLength: 1
          maxLength: 80
        lastName:
          type: string
          maxLength: 80
        email:
          type: string
          format: email
        university:
          type: string
          minLength: 2
          maxLength: 160
      required: [firstName, lastName, email, university]
    UserPreferences:
      type: object
      properties:
        defaultParkingPreference:
          type: string
          enum: [closest, most_available, lowest_occupancy]
        defaultCampus:
          type: string
        distanceUnits:
          type: string
          enum: [miles, kilometers]
        autoUseLocation:
          type: boolean
        favoriteGarageId:
          type: ["string", "null"]
        locationServices:
          type: boolean
        anonymousDataCollection:
          type: boolean
      required:
        - defaultParkingPreference
        - defaultCampus
        - distanceUnits
        - autoUseLocation
        - favoriteGarageId
        - locationServices
        - anonymousDataCollection
    UserPreferencesInput:
      allOf:
        - $ref: "#/components/schemas/UserPreferences"
    NotificationSettings:
      type: object
      properties:
        garageAlmostFullAlerts:
          type: boolean
        favoriteGarageAlerts:
          type: boolean
        parkingAvailabilityUpdates:
          type: boolean
        uparkAnnouncements:
          type: boolean
        notificationSound:
          type: boolean
      required:
        - garageAlmostFullAlerts
        - favoriteGarageAlerts
        - parkingAvailabilityUpdates
        - uparkAnnouncements
        - notificationSound
    NotificationSettingsInput:
      allOf:
        - $ref: "#/components/schemas/NotificationSettings"
    UserFavoritesInput:
      type: object
      properties:
        garageIds:
          type: array
          items:
            type: string
      required: [garageIds]
    UserProfileData:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: string
        authUserId:
          type: ["string", "null"]
        firstName:
          type: ["string", "null"]
        lastName:
          type: ["string", "null"]
        email:
          type: ["string", "null"]
        university:
          type: ["string", "null"]
        displayName:
          type: string
        preferences:
          $ref: "#/components/schemas/UserPreferences"
        notifications:
          $ref: "#/components/schemas/NotificationSettings"
        favoriteGarageIds:
          type: array
          items:
            type: string
        parkingReports:
          type: array
          items:
            $ref: "#/components/schemas/ParkingReport"
      required:
        - id
        - userId
        - authUserId
        - firstName
        - lastName
        - email
        - university
        - displayName
        - preferences
        - notifications
        - favoriteGarageIds
        - parkingReports
    SupportRequestInput:
      type: object
      properties:
        category:
          type: string
          minLength: 1
          maxLength: 60
        subject:
          type: string
          minLength: 3
          maxLength: 160
        message:
          type: string
          minLength: 10
          maxLength: 4000
        encounteredBug:
          type: boolean
        bugDescription:
          type: ["string", "null"]
          minLength: 1
          maxLength: 2000
        wouldRecommend:
          type: string
          enum: [yes, maybe, no]
      required: [category, subject, message, encounteredBug, wouldRecommend]
    SupportRequest:
      allOf:
        - $ref: "#/components/schemas/SupportRequestInput"
        - type: object
          properties:
            id:
              type: integer
            status:
              type: string
            createdAt:
              type: string
          required: [id, status, createdAt]

